# This workflow demonstrates how to use the Application Observability for AWS action
# with Claude Code using the anthropics/claude-code-action@v1.
#
# Key Features:
# - Brings your own Bedrock model (pay-per-token usage on your AWS account)
# - Integrates with AWS Application Signals and CloudWatch
# - Posts investigation results back to GitHub issues/PRs
#
# Prerequisites:
# 1. AWS IAM role with OIDC trust for GitHub Actions
# 2. Bedrock InvokeModel permissions in your IAM role
# 3. Application Signals and CloudWatch permissions
#
# Setup:
# 1. Create repository secret AWS_IAM_ROLE_ARN with your IAM role ARN
# 2. Copy this file to .github/workflows/awsapm.yml in your repository

name: Application observability for AWS (Claude Code Action)

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned, edited]

jobs:
  awsapm-investigation:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@awsapm')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@awsapm') || contains(github.event.issue.title, '@awsapm')))
    runs-on: ubuntu-latest

    permissions:
      contents: write        # To create branches for PRs
      pull-requests: write   # To post comments on PRs
      issues: write          # To post comments on issues
      id-token: write        # Required for AWS OIDC authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Step 1: Prepare AWS MCP configuration and investigation prompt
      - name: Prepare Investigation Context
        id: prepare
        uses: aws-actions/application-observability-for-aws@v1
        with:
          bot_name: "@awsapm"
          cli_tool: "claude_code"

      # Step 2: Read the prompt file content
      - name: Read Prompt File
        id: read_prompt
        run: |
          PROMPT_CONTENT=$(cat ${{ steps.prepare.outputs.prompt_file }})
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 3: Execute investigation with Claude Code Action
      - name: Run Claude Investigation
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Custom prompt from the prepared file
          prompt: ${{ steps.read_prompt.outputs.prompt }}

          # Use AWS Bedrock with OIDC authentication
          use_bedrock: "true"

          # Custom Claude CLI arguments with MCP config, allowed tools, and Bedrock model
          claude_args: "--mcp-config ${{ steps.prepare.outputs.mcp_config_file }} --allowed-tools ${{ steps.prepare.outputs.allowed_tools }} --model us.anthropic.claude-sonnet-4-5-20250929-v1:0"

          # Use GitHub workflow token for GitHub operations
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Optional: Custom settings
          settings: |
            {
              "maxTurns": 20
            }

      # Step 4: Post results back to GitHub issue/PR
      - name: Post Investigation Results
        if: always()
        uses: aws-actions/application-observability-for-aws@v1
        with:
          cli_tool: "claude_code"
          comment_id: ${{ steps.prepare.outputs.awsapm_comment_id }}
          output_file: ${{ steps.claude.outputs.execution_file }}
          output_status: ${{ steps.claude.outputs.conclusion }}
