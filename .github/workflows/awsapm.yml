name: Application observability for AWS

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned, edited]

env:
  BOT_NAME: '@awsapm'

jobs:
  awsapm-investigation:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, env.BOT_NAME)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, env.BOT_NAME) || contains(github.event.issue.title, env.BOT_NAME)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} # this should be the ARN of the IAM role created for Github Actions
          aws-region: 'us-east-1'

      - name: Run Application observability for AWS Investigation
        id: awsapm
        uses: mxiamxia/aws-apm-action@main
        with:
          bot_name: ${{ env.BOT_NAME }}
